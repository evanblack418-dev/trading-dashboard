<title>Breakout Bot Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0b'/%3E%3Cpath d='M6 23l7-8 5 4 8-11' fill='none' stroke='%232a78d6' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#fcfcfb;--panel:#fff;--ink:#0b0b0b;--ink2:#52514e;--line:#e6e5e0;--bad:#b83a26}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--panel:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--line:#2c2c2a;--bad:#e5604a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:16px}
.mark{width:40px;height:40px;border-radius:10px;background:#0b0b0b;display:grid;place-items:center}
.mark svg{width:24px;height:24px;stroke:#2a78d6}
h1{font-size:18px;margin:0}p{margin:0;color:var(--ink2);font-size:14px}
input[type=password]{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid #2a78d6;outline-offset:2px}
button{font:inherit;font-weight:600;padding:11px;border:0;border-radius:9px;background:var(--ink);color:var(--bg);cursor:pointer}
label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
#err{color:var(--bad);font-size:13px;min-height:18px}
</style></head><body>
<form class="card" id="f" autocomplete="on">

  <div id="err" role="alert"></div>
</form>
